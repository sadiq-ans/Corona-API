<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corona API</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <!-- Customize CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <div class="covid-container">
        <h1 class="h3 text-center my-4">Corona API</h1>
        <div class="container">
            <div class="row">

                <div class="col-12">
                    <!-- SEARCH CITY -->
                    <div class="covid-search input-group mb-3">
                        <input type="text" id="covid-input" class="form-control covid-input py-2"
                            placeholder="Enter state name..." />
                        <button id="covid-btn" class="btn btn-primary py-2">Get Data</button>
                    </div>

                    <!-- RESULT -->
                    <div id="covid-results" class="text-center">
                        <p id="covid-placeholder" class="text-muted">
                            Enter a state to see COVID-19 stats.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./assets/js/script.js"></script>

</body>

</html>
